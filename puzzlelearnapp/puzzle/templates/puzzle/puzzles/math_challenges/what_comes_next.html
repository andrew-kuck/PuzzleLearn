<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ puzzle_name }}</title>

  <style>
    :root {
      --blue: #2f65d9;
      --green: #22a65a;
      --red: #d93025;
      --light-gray: #e8e8e8;
      --dark: #222;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      /* background: linear-gradient(135deg, #f6f8ff, #eef3ff); */
      color: var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .activity {
      width: min(760px, 100%);
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      padding: 32px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    .directions {
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .sequence-box {
      background: #f7f9ff;
      border: 2px solid #dbe4ff;
      border-radius: 14px;
      padding: 26px 18px;
      margin-bottom: 24px;
      overflow-x: auto;
    }

    .sequence {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: bold;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.35em;
    }

    .answer-input {
      width: 110px;
      font-size: inherit;
      font-weight: bold;
      text-align: center;
      border: 2px solid #aaa;
      border-radius: 10px;
      padding: 6px 8px;
      outline: none;
    }

    .answer-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 101, 217, 0.18);
    }

    button {
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: bold;
      padding: 12px 28px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: #214fb0;
      transform: translateY(-1px);
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
      transform: none;
    }

    .progress-wrapper {
      margin-top: 28px;
      text-align: left;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 22px;
      background: var(--light-gray);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #ccc;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #23a455, #63d471);
      transition: width 0.35s ease;
    }

    .overlay-feedback {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1000;
      font-size: min(32vw, 220px);
      font-weight: bold;
      text-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .overlay-feedback.show {
      opacity: 1;
      transform: scale(1);
    }

    .overlay-feedback.correct {
      color: var(--green);
    }

    .overlay-feedback.incorrect {
      color: var(--red);
    }

    .complete-message {
      display: none;
      margin-top: 24px;
      padding: 18px;
      border-radius: 12px;
      background: #e9f8ef;
      border: 2px solid #bfe8cf;
      color: #146c36;
      font-weight: bold;
      font-size: 1.15rem;
    }

    .complete-message.show {
      display: block;
    }
  </style>
</head>

<body>
  <main class="activity">
    <h1>What Comes Next?</h1>

    <!-- <p class="directions">
      Each sequence comes from a linear, quadratic, or cubic function evaluated at consecutive integer inputs.
      Type the next term in the sequence.
    </p> -->

    <form id="answerForm">
      <div class="sequence-box">
        <div id="sequenceLine" class="sequence" aria-live="polite"></div>
      </div>

      <button id="submitButton" type="submit">Check Answer</button>
    </form>

    <div class="progress-wrapper">
      <div class="progress-label" style="display: none;">
        <span>Progress</span>
        <span id="progressText">0 / 10</span>
      </div>
      <div class="progress-bar" aria-label="Progress toward completing the activity">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div id="completeMessage" class="complete-message">
      Activity complete. Nice work!
    </div>
  </main>

  <div id="feedbackOverlay" class="overlay-feedback" aria-hidden="true"></div>

  <script>
    /*
      If this activity is embedded in a larger platform, that platform can define
      its own activityComplete() function. This fallback prevents errors when
      running this file by itself.
    */
    window.activityComplete = window.activityComplete || function () {
      console.log("activityComplete() called");
    };

    const TOTAL_CORRECT_NEEDED = 8;
    const CAN_BE_CUBIC = false;

    let correctCount = 0;
    let currentProblem = null;
    let completed = false;

    const sequenceLine = document.getElementById("sequenceLine");
    const answerForm = document.getElementById("answerForm");
    const submitButton = document.getElementById("submitButton");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const feedbackOverlay = document.getElementById("feedbackOverlay");
    const completeMessage = document.getElementById("completeMessage");

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randomNonzeroInt(min, max) {
      let n = 0;
      while (n === 0) {
        n = randomInt(min, max);
      }
      return n;
    }

    function evaluatePolynomial(coefficients, x) {
      // coefficients are ordered from highest degree to constant term
      return coefficients.reduce((value, coefficient) => value * x + coefficient, 0);
    }

    function isStrictlyMonotonic(values) {
      const increasing = values.every((value, index) => {
        return index === 0 || value > values[index - 1];
      });

      const decreasing = values.every((value, index) => {
        return index === 0 || value < values[index - 1];
      });

      return increasing || decreasing;
    }

    function createCoefficients(degree) {
      if (degree === 1) {
        return [
          randomNonzeroInt(-8, 8),
          randomInt(-20, 20)
        ];
      }

      if (degree === 2) {
        return [
          randomNonzeroInt(-3, 3),
          randomInt(-8, 8),
          randomInt(-20, 20)
        ];
      }

      return [
        randomNonzeroInt(-2, 2),
        randomInt(-4, 4),
        randomInt(-8, 8),
        randomInt(-20, 20)
      ];
    }

    function generateProblem() {
      /*
        The displayed terms are f(x), f(x + direction), f(x + 2direction), ...
        where direction is either 1 or -1.

        This means the terms always come from consecutive integer inputs, and
        the input order may be increasing or decreasing.
      */

      for (let attempt = 0; attempt < 1000; attempt++) {
        const maxDegree = CAN_BE_CUBIC ? 3 : 2;
        const degree = randomInt(1, maxDegree);
        const coefficients = createCoefficients(degree);

        const numberOfShownTerms = randomInt(4, 5);
        const startX = randomInt(-5, 5);
        const direction = Math.random() < 0.5 ? 1 : -1;

        const xValues = [];

        for (let i = 0; i <= numberOfShownTerms; i++) {
          xValues.push(startX + direction * i);
        }

        const values = xValues.map(x => evaluatePolynomial(coefficients, x));
        const shownTerms = values.slice(0, numberOfShownTerms);
        const answer = values[numberOfShownTerms];

        const allValuesAreReasonable = values.every(value => Math.abs(value) <= 5000);

        if (allValuesAreReasonable && isStrictlyMonotonic(values)) {
          return {
            shownTerms,
            answer,
            degree,
            coefficients,
            xValues,
            direction
          };
        }
      }

      // Very unlikely fallback: simple linear sequence.
      const first = randomInt(-20, 20);
      const difference = randomNonzeroInt(-10, 10);
      const shownTerms = [first, first + difference, first + 2 * difference, first + 3 * difference];

      return {
        shownTerms,
        answer: first + 4 * difference,
        degree: 1,
        coefficients: [difference, first - difference],
        xValues: [1, 2, 3, 4, 5],
        direction: 1
      };
    }

    function renderProblem() {
      sequenceLine.innerHTML = "";

      currentProblem.shownTerms.forEach((term, index) => {
        const termSpan = document.createElement("span");
        termSpan.textContent = term;
        sequenceLine.appendChild(termSpan);

        const comma = document.createElement("span");
        comma.textContent = ",";
        sequenceLine.appendChild(comma);
      });

      const input = document.createElement("input");
      input.id = "answerInput";
      input.className = "answer-input";
      input.type = "number";
      input.inputMode = "numeric";
      input.autocomplete = "off";
      input.setAttribute("aria-label", "Enter the next term in the sequence");

      sequenceLine.appendChild(input);

      setTimeout(() => input.focus(), 0);
    }

    function showFeedback(isCorrect) {
      feedbackOverlay.textContent = isCorrect ? "✓" : "✕";
      feedbackOverlay.className = "overlay-feedback show " + (isCorrect ? "correct" : "incorrect");

      setTimeout(() => {
        feedbackOverlay.className = "overlay-feedback";
      }, 650);
    }

    function updateProgress() {
      const percent = (correctCount / TOTAL_CORRECT_NEEDED) * 100;
      progressFill.style.width = percent + "%";
      progressText.textContent = `${correctCount} / ${TOTAL_CORRECT_NEEDED}`;
    }

    function startNewProblem() {
      currentProblem = generateProblem();
      renderProblem();
    }

    function completeActivity() {
      completed = true;
      submitButton.disabled = true;
      completeMessage.classList.add("show");

      activityComplete();
    }

    answerForm.addEventListener("submit", function (event) {
      event.preventDefault();

      if (completed) return;

      const answerInput = document.getElementById("answerInput");
      const userAnswer = Number(answerInput.value);

      if (answerInput.value.trim() === "") {
        answerInput.focus();
        return;
      }

      if (userAnswer === currentProblem.answer) {
        correctCount++;
        updateProgress();
        showFeedback(true);

        if (correctCount >= TOTAL_CORRECT_NEEDED) {
          setTimeout(() => {
            completeActivity();
          }, 700);
        } else {
          setTimeout(() => {
            startNewProblem();
          }, 700);
        }
      } else {
        showFeedback(false);
        answerInput.select();
      }
    });

    updateProgress();
    startNewProblem();

  </script>
<script src="/static/puzzle/js/activity.js"></script>
<script>autoZoom();</script>
</body>
</html>
