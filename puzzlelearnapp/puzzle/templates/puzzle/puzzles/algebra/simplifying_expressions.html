<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ puzzle_name }}</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      /* background: linear-gradient(135deg, #e3f2fd, #fce4ec); */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #222;
    }

    .activity {
      background: white;
      width: min(90%, 650px);
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    .instructions {
      font-size: 1rem;
      color: #555;
      margin-bottom: 24px;
    }

    .expression-box {
      font-size: 2rem;
      font-weight: bold;
      padding: 24px;
      margin: 20px 0;
      border-radius: 14px;
      background: #f5f7fa;
      border: 2px solid #dce3ea;
      min-height: 48px;
    }

    input {
      font-size: 1.3rem;
      padding: 12px 14px;
      width: min(90%, 420px);
      border: 2px solid #bbb;
      border-radius: 10px;
      outline: none;
      text-align: center;
    }

    input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
    }

    button {
      margin-top: 18px;
      font-size: 1.1rem;
      padding: 12px 26px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #125ca5;
    }

    .progress-container {
      margin-top: 28px;
      width: 100%;
      height: 24px;
      background: #e0e0e0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #43a047, #8bc34a);
      transition: width 0.35s ease;
    }

    .progress-label {
      margin-top: 10px;
      font-weight: bold;
      color: #444;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.35);
      z-index: 1000;
      pointer-events: none;
    }

    .symbol {
      font-size: 10rem;
      font-weight: bold;
      animation: pop 0.45s ease;
      text-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .correct {
      color: #1baf4b;
    }

    .incorrect {
      color: #d32f2f;
    }

    @keyframes pop {
      0% {
        transform: scale(0.4);
        opacity: 0;
      }
      65% {
        transform: scale(1.15);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="activity">
    <h1>Simplify the Expression</h1>

    <div class="instructions">
      Enter an equivalent simplified expression. Spaces do not matter.
      <!-- <br />
      Examples: <strong>2x + 3</strong>, <strong>3 + 2*x</strong>, or <strong>2*x+3</strong> -->
    </div>

    <div id="expression" class="expression-box"></div>

    <input
      id="answerInput"
      type="text"
      placeholder="Type your simplified answer"
      autocomplete="off"
    />

    <br />

    <button onclick="checkAnswer()">Check Answer</button>

    <div class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div style="display: none;" id="progressLabel" class="progress-label">0 / 10 correct</div>
  </div>

  <div id="overlay" class="overlay">
    <div id="overlaySymbol" class="symbol"></div>
  </div>

  <script>
    const TOTAL_CORRECT_NEEDED = 5;

    let correctCount = 0;
    let currentAnswer = null;

    const expressionEl = document.getElementById("expression");
    const answerInput = document.getElementById("answerInput");
    const progressBar = document.getElementById("progressBar");
    const progressLabel = document.getElementById("progressLabel");
    const overlay = document.getElementById("overlay");
    const overlaySymbol = document.getElementById("overlaySymbol");

    /*
      A linear expression is represented as:
      {
        x: coefficient of x,
        y: coefficient of y,
        c: constant
      }

      Example:
      3x - 2y + 5 becomes { x: 3, y: -2, c: 5 }
    */

    function activityComplete() {
      alert("Activity complete! Great work.");
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    const DIVISION_SIGN = "÷";

    function nonzeroRandInt(min, max) {
      let n = 0;
      while (n === 0) {
        n = randInt(min, max);
      }
      return n;
    }

    function formatSignedTerm(coef, variable, isFirst) {
      if (coef === 0) return "";

      const sign = coef < 0 ? "-" : "+";
      const absCoef = Math.abs(coef);
      const coefText = absCoef === 1 ? variable : absCoef + variable;

      if (isFirst) {
        return coef < 0 ? "-" + coefText : coefText;
      }

      return ` ${sign} ${coefText}`;
    }

    function formatSignedConstant(value, isFirst) {
      if (value === 0) return "";

      const sign = value < 0 ? "-" : "+";
      const absValue = Math.abs(value);

      if (isFirst) {
        return value < 0 ? "-" + absValue : String(absValue);
      }

      return ` ${sign} ${absValue}`;
    }

    function vectorToString(v) {
      const parts = [];
      let isFirst = true;

      const xTerm = formatSignedTerm(v.x, "x", isFirst);
      if (xTerm) {
        parts.push(xTerm);
        isFirst = false;
      }

      const yTerm = formatSignedTerm(v.y, "y", isFirst);
      if (yTerm) {
        parts.push(yTerm);
        isFirst = false;
      }

      const cTerm = formatSignedConstant(v.c, isFirst);
      if (cTerm) {
        parts.push(cTerm);
        isFirst = false;
      }

      return parts.length ? parts.join("") : "0";
    }

    function vectorsEqual(a, b) {
      return a.x === b.x && a.y === b.y && a.c === b.c;
    }

    function makeProblem() {
      const template = randInt(1, 5);

      let expression;
      let answer;

      if (template === 1) {
        // a(bx + c) + d(ex + f)
        const a = nonzeroRandInt(-5, 5);
        const b = nonzeroRandInt(-6, 6);
        const c = randInt(-9, 9);
        const d = nonzeroRandInt(-5, 5);
        const e = nonzeroRandInt(-6, 6);
        const f = randInt(-9, 9);

        expression = `${a}(${b}x ${c < 0 ? "- " + Math.abs(c) : "+ " + c}) ${d < 0 ? "- " + Math.abs(d) : "+ " + d}(${e}x ${f < 0 ? "- " + Math.abs(f) : "+ " + f})`;

        answer = {
          x: a * b + d * e,
          y: 0,
          c: a * c + d * f
        };
      }

      else if (template === 2) {
        // a(bx + cy + d) - e(fx - gy + h)
        const a = nonzeroRandInt(-4, 4);
        const b = nonzeroRandInt(-5, 5);
        const c = nonzeroRandInt(-5, 5);
        const d = randInt(-8, 8);
        const e = nonzeroRandInt(-4, 4);
        const f = nonzeroRandInt(-5, 5);
        const g = nonzeroRandInt(-5, 5);
        const h = randInt(-8, 8);

        expression = `${a}(${b}x ${c < 0 ? "- " + Math.abs(c) : "+ " + c}y ${d < 0 ? "- " + Math.abs(d) : "+ " + d}) - ${e}(${f}x ${g < 0 ? "+ " + Math.abs(g) : "- " + g}y ${h < 0 ? "- " + Math.abs(h) : "+ " + h})`;

        answer = {
          x: a * b - e * f,
          y: a * c + e * g,
          c: a * d - e * h
        };
      }

      else if (template === 3) {
        // ((gx + gn) / g) + kx + m
        const g = randInt(2, 6);
        const p = nonzeroRandInt(-6, 6);
        const n = randInt(-8, 8);
        const k = nonzeroRandInt(-5, 5);
        const m = randInt(-8, 8);

        expression = `(${g * p}x ${g * n < 0 ? "- " + Math.abs(g * n) : "+ " + g * n}) ${DIVISION_SIGN} ${g} ${k < 0 ? "- " + Math.abs(k) : "+ " + k}x ${m < 0 ? "- " + Math.abs(m) : "+ " + m}`;

        answer = {
          x: p + k,
          y: 0,
          c: n + m
        };
      }

      else if (template === 4) {
        // a(x + by) + c(y + d) - e
        const a = nonzeroRandInt(-7, 7);
        const b = nonzeroRandInt(-5, 5);
        const c = nonzeroRandInt(-7, 7);
        const d = randInt(-9, 9);
        const e = randInt(-9, 9);

        expression = `${a}(x ${b < 0 ? "- " + Math.abs(b) : "+ " + b}y) ${c < 0 ? "- " + Math.abs(c) : "+ " + c}(y ${d < 0 ? "- " + Math.abs(d) : "+ " + d}) ${e < 0 ? "+ " + Math.abs(e) : "- " + e}`;

        answer = {
          x: a,
          y: a * b + c,
          c: c * d - e
        };
      }

      else {
        // a - b(cx + d) + e(fx + gy)
        const a = randInt(-10, 10);
        const b = nonzeroRandInt(-5, 5);
        const c = nonzeroRandInt(-6, 6);
        const d = randInt(-8, 8);
        const e = nonzeroRandInt(-5, 5);
        const f = nonzeroRandInt(-6, 6);
        const g = nonzeroRandInt(-6, 6);

        expression = `${a} - ${b}(${c}x ${d < 0 ? "- " + Math.abs(d) : "+ " + d}) ${e < 0 ? "- " + Math.abs(e) : "+ " + e}(${f}x ${g < 0 ? "- " + Math.abs(g) : "+ " + g}y)`;

        answer = {
          x: -b * c + e * f,
          y: e * g,
          c: a - b * d
        };
      }

      // Avoid the rare zero-expression problem.
      if (answer.x === 0 && answer.y === 0 && answer.c === 0) {
        return makeProblem();
      }

      return { expression, answer };
    }

    function newProblem() {
      const problem = makeProblem();
      expressionEl.textContent = problem.expression;
      currentAnswer = problem.answer;
      answerInput.value = "";
      answerInput.focus();
    }

    function parseSimpleTerms(input) {
      const normalized = input
        .replace(/\s+/g, "")
        .replace(/[−–—]/g, "-")
        .replace(/÷/g, "/");

      if (!normalized) {
        return null;
      }

      if (/[()]/.test(normalized)) {
        return null;
      }

      if (normalized.includes("/")) {
        return null;
      }

      const terms = [];
      let current = "";
      let expectingTerm = true;

      for (let i = 0; i < normalized.length; i++) {
        const ch = normalized[i];

        if ((ch === "+" || ch === "-") && expectingTerm) {
          current += ch;
          continue;
        }

        if (ch === "+" || ch === "-") {
          if (current) {
            terms.push(current);
            current = "";
          }
          current += ch;
          expectingTerm = true;
          continue;
        }

        current += ch;
        expectingTerm = false;
      }

      if (current) {
        terms.push(current);
      }

      return terms.map((term) => {
        const sign = term.startsWith("-") ? -1 : 1;
        const body = term.replace(/^[+-]/, "");

        if (!body) {
          return null;
        }

        if (body.includes("*")) {
          const parts = body.split("*");
          if (parts.length !== 2) {
            return null;
          }

          const left = parts[0];
          const right = parts[1];
          const leftIsNumber = /^\d+$/.test(left);
          const rightIsNumber = /^\d+$/.test(right);
          const leftIsVariable = /^[xy]$/.test(left);
          const rightIsVariable = /^[xy]$/.test(right);

          if (!((leftIsNumber && rightIsVariable) || (leftIsVariable && rightIsNumber))) {
            return null;
          }

          const coefficient = sign * parseInt(leftIsNumber ? left : right, 10);
          const variable = leftIsVariable ? left : right;
          return { type: "variable", variable, coefficient };
        }

        if (/^\d+$/.test(body)) {
          return { type: "constant", value: sign * parseInt(body, 10) };
        }

        if (/^([xy])$/.test(body)) {
          return { type: "variable", variable: body, coefficient: sign };
        }

        if (/^(\d+)([xy])$/.test(body)) {
          const match = body.match(/^(\d+)([xy])$/);
          return { type: "variable", variable: match[2], coefficient: sign * parseInt(match[1], 10) };
        }

        return null;
      }).filter(Boolean);
    }

    function isCanonicalSimplifiedExpression(input, answer) {
      const terms = parseSimpleTerms(input);

      if (!terms || terms.length === 0) {
        return answer.x === 0 && answer.y === 0 && answer.c === 0;
      }

      const requiredKinds = [];
      if (answer.c !== 0) {
        requiredKinds.push("constant");
      }
      if (answer.x !== 0) {
        requiredKinds.push("x");
      }
      if (answer.y !== 0) {
        requiredKinds.push("y");
      }

      const presentKinds = terms.map((term) => {
        if (term.type === "variable") {
          return term.variable;
        }
        return "constant";
      });

      if (presentKinds.length !== requiredKinds.length) {
        return false;
      }

      const uniqueKinds = new Set(presentKinds);
      if (uniqueKinds.size !== presentKinds.length) {
        return false;
      }

      return requiredKinds.every((kind) => presentKinds.includes(kind));
    }

    /*
      Parser for user input.

      Supports:
      - integers
      - x and y
      - +, -, *, /
      - parentheses
      - implicit multiplication, such as 2x or 3(x + 1)

      Rejects:
      - exponents
      - nonlinear terms like x*x or xy
      - decimals
      - division by variables or non-divisible coefficients
    */

    function tokenize(input) {
      const s = input.replace(/\s+/g, "").replace(/÷/g, "/");
      const tokens = [];
      let i = 0;

      while (i < s.length) {
        const ch = s[i];

        if (/[0-9]/.test(ch)) {
          let num = ch;
          i++;
          while (i < s.length && /[0-9]/.test(s[i])) {
            num += s[i];
            i++;
          }
          tokens.push({ type: "number", value: parseInt(num, 10) });
          continue;
        }

        if (ch === "x" || ch === "y") {
          tokens.push({ type: "variable", value: ch });
          i++;
          continue;
        }

        if ("+-*/()".includes(ch)) {
          tokens.push({ type: ch, value: ch });
          i++;
          continue;
        }

        throw new Error("Invalid character");
      }

      return insertImplicitMultiplication(tokens);
    }

    function insertImplicitMultiplication(tokens) {
      const result = [];

      for (let i = 0; i < tokens.length; i++) {
        const current = tokens[i];
        const previous = result[result.length - 1];

        if (previous) {
          const previousCanEnd =
            previous.type === "number" ||
            previous.type === "variable" ||
            previous.type === ")";

          const currentCanStart =
            current.type === "number" ||
            current.type === "variable" ||
            current.type === "(";

          if (previousCanEnd && currentCanStart) {
            result.push({ type: "*", value: "*" });
          }
        }

        result.push(current);
      }

      return result;
    }

    function parseUserExpression(input) {
      const tokens = tokenize(input);
      let pos = 0;

      function peek() {
        return tokens[pos];
      }

      function consume(type) {
        if (peek() && peek().type === type) {
          return tokens[pos++];
        }
        throw new Error("Expected " + type);
      }

      function numberVector(n) {
        return { x: 0, y: 0, c: n };
      }

      function variableVector(v) {
        return v === "x"
          ? { x: 1, y: 0, c: 0 }
          : { x: 0, y: 1, c: 0 };
      }

      function add(a, b) {
        return {
          x: a.x + b.x,
          y: a.y + b.y,
          c: a.c + b.c
        };
      }

      function subtract(a, b) {
        return {
          x: a.x - b.x,
          y: a.y - b.y,
          c: a.c - b.c
        };
      }

      function multiply(a, b) {
        const aIsConstant = a.x === 0 && a.y === 0;
        const bIsConstant = b.x === 0 && b.y === 0;

        if (!aIsConstant && !bIsConstant) {
          throw new Error("Nonlinear expression");
        }

        if (aIsConstant) {
          return {
            x: a.c * b.x,
            y: a.c * b.y,
            c: a.c * b.c
          };
        }

        return {
          x: b.c * a.x,
          y: b.c * a.y,
          c: b.c * a.c
        };
      }

      function divide(a, b) {
        if (b.x !== 0 || b.y !== 0) {
          throw new Error("Cannot divide by a variable expression");
        }

        if (b.c === 0) {
          throw new Error("Division by zero");
        }

        if (a.x % b.c !== 0 || a.y % b.c !== 0 || a.c % b.c !== 0) {
          throw new Error("Non-integer simplified result");
        }

        return {
          x: a.x / b.c,
          y: a.y / b.c,
          c: a.c / b.c
        };
      }

      function parseExpression() {
        let value = parseTerm();

        while (peek() && (peek().type === "+" || peek().type === "-")) {
          const op = peek().type;
          pos++;
          const right = parseTerm();

          value = op === "+" ? add(value, right) : subtract(value, right);
        }

        return value;
      }

      function parseTerm() {
        let value = parseFactor();

        while (peek() && (peek().type === "*" || peek().type === "/")) {
          const op = peek().type;
          pos++;
          const right = parseFactor();

          value = op === "*" ? multiply(value, right) : divide(value, right);
        }

        return value;
      }

      function parseFactor() {
        if (!peek()) {
          throw new Error("Unexpected end");
        }

        if (peek().type === "+") {
          consume("+");
          return parseFactor();
        }

        if (peek().type === "-") {
          consume("-");
          return multiply(numberVector(-1), parseFactor());
        }

        if (peek().type === "number") {
          return numberVector(consume("number").value);
        }

        if (peek().type === "variable") {
          return variableVector(consume("variable").value);
        }

        if (peek().type === "(") {
          consume("(");
          const value = parseExpression();
          consume(")");
          return value;
        }

        throw new Error("Unexpected token");
      }

      const result = parseExpression();

      if (pos !== tokens.length) {
        throw new Error("Extra tokens");
      }

      return result;
    }

    function showOverlay(isCorrect) {
      overlaySymbol.textContent = isCorrect ? "✓" : "✕";
      overlaySymbol.className = "symbol " + (isCorrect ? "correct" : "incorrect");

      overlay.style.display = "flex";

      setTimeout(() => {
        overlay.style.display = "none";
      }, 700);
    }

    function updateProgress() {
      const percent = (correctCount / TOTAL_CORRECT_NEEDED) * 100;
      progressBar.style.width = percent + "%";
      progressLabel.textContent = `${correctCount} / ${TOTAL_CORRECT_NEEDED} correct`;
    }

    function checkAnswer() {
      const userText = answerInput.value.trim();

      if (!userText) return;

      try {
        const userAnswer = parseUserExpression(userText);

        if (vectorsEqual(userAnswer, currentAnswer) && isCanonicalSimplifiedExpression(userText, currentAnswer)) {
          correctCount++;
          updateProgress();
          showOverlay(true);

          if (correctCount >= TOTAL_CORRECT_NEEDED) {
            setTimeout(() => {
              activityComplete();
            }, 800);
          } else {
            setTimeout(() => {
              newProblem();
            }, 800);
          }
        } else {
          showOverlay(false);
        }
      } catch (error) {
        showOverlay(false);
      }
    }

    answerInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkAnswer();
      }
    });

    newProblem();
    updateProgress();

  </script>
<script src="/static/puzzle/js/activity.js"></script>
<script>autoZoom();</script>
</body>
</html>
