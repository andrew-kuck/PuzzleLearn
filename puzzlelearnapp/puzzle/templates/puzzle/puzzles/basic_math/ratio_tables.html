<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ puzzle_name }}</title>

  <style>
    :root {
      --bg: #f7f9fc;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --blue: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
      --border: #d1d5db;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    .directions {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .activity-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .progress-container {
      width: 100%;
      height: 24px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #22c55e);
      transition: width 0.4s ease;
    }

    .progress-label {
      text-align: center;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
      align-items: stretch;
    }

    .panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border: 1px solid #eef0f3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
    }

    th,
    td {
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
      font-size: 1.1rem;
    }

    th {
      background: #111827;
      color: white;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .row-label {
      font-weight: bold;
      color: white;
      width: 50px;
    }

    input.ratio-input {
      width: 80px;
      padding: 8px;
      font-size: 1rem;
      text-align: center;
      border: 2px solid #9ca3af;
      border-radius: 8px;
      background: white;
    }

    input.ratio-input:focus {
      outline: 3px solid rgba(37, 99, 235, 0.25);
      border-color: var(--blue);
    }

    .fixed-value {
      display: inline-block;
      min-width: 50px;
      font-weight: bold;
    }

    .button-row {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    #submitBtn {
      background: var(--blue);
      color: white;
    }

    #submitBtn:hover {
      background: #1d4ed8;
    }

    #newProblemBtn {
      background: #e5e7eb;
      color: #111827;
    }

    #newProblemBtn:hover {
      background: #d1d5db;
    }

    .graph-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      width: 100%;
      max-width: 520px;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    .graph-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.55);
      z-index: 1000;
      pointer-events: none;
    }

    .overlay-symbol {
      font-size: 10rem;
      font-weight: bold;
      line-height: 1;
      animation: pop 0.45s ease;
      text-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .overlay-symbol.correct {
      color: var(--green);
    }

    .overlay-symbol.incorrect {
      color: var(--red);
    }

    @keyframes pop {
      0% {
        transform: scale(0.4);
        opacity: 0;
      }
      70% {
        transform: scale(1.15);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 800px) {
      .main {
        grid-template-columns: 1fr;
      }

      canvas {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="activity-wrapper">
    <div style="display: none;" class="progress-label" id="progressLabel">Progress: 0 / 5</div>
    <div class="progress-container" aria-label="Progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div style="margin: 15px; text-align: center; font-size: 20px;">Fill in the missing values to create equivalent ratios A:B.</div>

    <section class="main">
      <div class="panel">
        <h2>Ratio Table</h2>

        <table aria-label="Equivalent ratio table">
          <thead>
            <tr>
              <th>Row</th>
              <th>A</th>
              <th>B</th>
            </tr>
          </thead>
          <tbody id="ratioTableBody"></tbody>
        </table>

        <div class="button-row">
          <button id="submitBtn">Submit Answer</button>
          <button id="newProblemBtn" type="button">New Problem</button>
        </div>
      </div>

      <div class="panel graph-panel">
        <h2>Graph</h2>
        <canvas id="ratioGraph" width="520" height="520" aria-label="Graph of ratio points"></canvas>
      </div>
    </section>
  </main>

  <div class="overlay" id="overlay">
    <div class="overlay-symbol" id="overlaySymbol"></div>
  </div>

  <script>
    /************************************************************
     * If this activity is embedded in another platform, that
     * platform may already define activityComplete().
     ************************************************************/
    if (typeof window.activityComplete !== "function") {
      window.activityComplete = function () {
        alert("Activity complete! Great work.");
      };
    }

    const tableBody = document.getElementById("ratioTableBody");
    const canvas = document.getElementById("ratioGraph");
    const ctx = canvas.getContext("2d");
    const submitBtn = document.getElementById("submitBtn");
    const newProblemBtn = document.getElementById("newProblemBtn");
    const progressBar = document.getElementById("progressBar");
    const progressLabel = document.getElementById("progressLabel");
    const overlay = document.getElementById("overlay");
    const overlaySymbol = document.getElementById("overlaySymbol");

    const rowColors = [
      "#ef4444", // red
      "#f97316", // orange
      "#eab308", // yellow
      "#22c55e", // green
      "#3b82f6"  // blue
    ];

    let currentProblem = [];
    let correctCount = 0;
    const totalNeeded = 4;

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function gcd(a, b) {
      while (b !== 0) {
        const temp = b;
        b = a % b;
        a = temp;
      }
      return a;
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = randomInt(0, i);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function chooseRandomBaseRatio() {
      /*
        We need at least 5 different integer multiples that stay between 1 and 100.
        If max(baseA, baseB) <= 20, then multiples 1 through at least 5 are possible.
      */
      const possibleBases = [];

      for (let a = 1; a <= 20; a++) {
        for (let b = 1; b <= 20; b++) {
          if (gcd(a, b) === 1) {
            possibleBases.push({ a, b });
          }
        }
      }

      return possibleBases[randomInt(0, possibleBases.length - 1)];
    }

    function generateProblem() {
      const base = chooseRandomBaseRatio();
      const maxMultiplier = Math.floor(100 / Math.max(base.a, base.b));

      const multipliers = [];
      for (let k = 1; k <= maxMultiplier; k++) {
        multipliers.push(k);
      }

      const chosenMultipliers = shuffle(multipliers).slice(0, 5);

      const fullVisibleRowIndex = randomInt(0, 4);

      currentProblem = chosenMultipliers.map((k, index) => {
        let hiddenColumn = null;

        if (index !== fullVisibleRowIndex) {
          hiddenColumn = Math.random() < 0.5 ? "A" : "B";
        }

        return {
          A: base.a * k,
          B: base.b * k,
          color: rowColors[index],
          hiddenColumn
        };
      });

      renderTable();
      drawGraph();
    }

    function renderTable() {
      tableBody.innerHTML = "";

      currentProblem.forEach((row, index) => {
        const tr = document.createElement("tr");

        const labelCell = document.createElement("td");
        labelCell.className = "row-label";
        labelCell.textContent = index + 1;
        labelCell.style.backgroundColor = row.color;

        const aCell = document.createElement("td");
        const bCell = document.createElement("td");

        if (row.hiddenColumn === "A") {
          aCell.appendChild(createInput(index, "A"));
        } else {
          aCell.innerHTML = `<span class="fixed-value">${row.A}</span>`;
        }

        if (row.hiddenColumn === "B") {
          bCell.appendChild(createInput(index, "B"));
        } else {
          bCell.innerHTML = `<span class="fixed-value">${row.B}</span>`;
        }

        tr.appendChild(labelCell);
        tr.appendChild(aCell);
        tr.appendChild(bCell);

        tableBody.appendChild(tr);
      });
    }

    function createInput(rowIndex, column) {
      const input = document.createElement("input");
      input.type = "number";
      input.min = "1";
      input.max = "100";
      input.step = "1";
      input.className = "ratio-input";
      input.dataset.rowIndex = rowIndex;
      input.dataset.column = column;
      input.setAttribute("aria-label", `Row ${rowIndex + 1}, missing ${column} value`);

      input.addEventListener("input", drawGraph);

      return input;
    }

    function getDisplayedValue(rowIndex, column) {
      const row = currentProblem[rowIndex];

      if (row.hiddenColumn !== column) {
        return row[column];
      }

      const input = document.querySelector(
        `input[data-row-index="${rowIndex}"][data-column="${column}"]`
      );

      if (!input || input.value.trim() === "") {
        return null;
      }

      const value = Number(input.value);

      if (!Number.isInteger(value)) {
        return null;
      }

      return value;
    }

    function drawGraph() {
      const width = canvas.width;
      const height = canvas.height;

      ctx.clearRect(0, 0, width, height);

      const margin = 52;
      const graphWidth = width - margin * 2;
      const graphHeight = height - margin * 2;

      function xScale(x) {
        return margin + (x / 100) * graphWidth;
      }

      function yScale(y) {
        return height - margin - (y / 100) * graphHeight;
      }

      // Background
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);

      // Grid lines
      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;
      ctx.font = "12px Arial";
      ctx.fillStyle = "#6b7280";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let value = 0; value <= 100; value += 20) {
        const x = xScale(value);
        const y = yScale(value);

        ctx.beginPath();
        ctx.moveTo(x, margin);
        ctx.lineTo(x, height - margin);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(margin, y);
        ctx.lineTo(width - margin, y);
        ctx.stroke();

        ctx.fillText(value, x, height - margin + 22);
        ctx.fillText(value, margin - 24, y);
      }

      // Axes
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(margin, height - margin);
      ctx.lineTo(width - margin, height - margin);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(margin, height - margin);
      ctx.lineTo(margin, margin);
      ctx.stroke();

      // Axis labels
      ctx.fillStyle = "#111827";
      ctx.font = "bold 16px Arial";
      ctx.textAlign = "center";
      ctx.fillText("A", width / 2, height - 12);

      ctx.save();
      ctx.translate(16, height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("B", 0, 0);
      ctx.restore();

      // Plot points that have both values filled in.
      currentProblem.forEach((row, index) => {
        const aValue = getDisplayedValue(index, "A");
        const bValue = getDisplayedValue(index, "B");

        if (
          aValue !== null &&
          bValue !== null &&
          aValue >= 1 &&
          aValue <= 100 &&
          bValue >= 1 &&
          bValue <= 100
        ) {
          const x = xScale(aValue);
          const y = yScale(bValue);

          ctx.beginPath();
          ctx.arc(x, y, 8, 0, Math.PI * 2);
          ctx.fillStyle = row.color;
          ctx.fill();

          ctx.strokeStyle = "#111827";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.font = "bold 13px Arial";
          ctx.fillStyle = "#111827";
          ctx.textAlign = "left";
          ctx.textBaseline = "bottom";
          ctx.fillText(`(${aValue}, ${bValue})`, x + 10, y - 8);
        }
      });
    }

    function checkAnswer() {
      for (let i = 0; i < currentProblem.length; i++) {
        const row = currentProblem[i];

        if (row.hiddenColumn === null) {
          continue;
        }

        const input = document.querySelector(
          `input[data-row-index="${i}"][data-column="${row.hiddenColumn}"]`
        );

        const userValue = Number(input.value);

        if (
          input.value.trim() === "" ||
          !Number.isInteger(userValue) ||
          userValue !== row[row.hiddenColumn]
        ) {
          return false;
        }
      }

      return true;
    }

    function showOverlay(isCorrect) {
      overlaySymbol.textContent = isCorrect ? "✓" : "×";
      overlaySymbol.className = `overlay-symbol ${isCorrect ? "correct" : "incorrect"}`;

      overlay.style.display = "flex";

      setTimeout(() => {
        overlay.style.display = "none";
      }, 800);
    }

    function updateProgress() {
      const percentage = (correctCount / totalNeeded) * 100;
      progressBar.style.width = `${percentage}%`;
      progressLabel.textContent = `Progress: ${correctCount} / ${totalNeeded}`;
    }

    submitBtn.addEventListener("click", () => {
      const isCorrect = checkAnswer();

      if (isCorrect) {
        correctCount++;
        updateProgress();
        showOverlay(true);

        if (correctCount >= totalNeeded) {
          submitBtn.disabled = true;
          newProblemBtn.disabled = true;

          setTimeout(() => {
            activityComplete();
          }, 900);
        } else {
          setTimeout(() => {
            generateProblem();
          }, 900);
        }
      } else {
        showOverlay(false);
      }
    });

    newProblemBtn.addEventListener("click", () => {
      generateProblem();
    });

    // Allow Enter key to submit from any input.
    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        submitBtn.click();
      }
    });

    // Start activity.
    updateProgress();
    generateProblem();

  </script>
<script src="/static/puzzle/js/activity.js"></script>
</body>
</html>
