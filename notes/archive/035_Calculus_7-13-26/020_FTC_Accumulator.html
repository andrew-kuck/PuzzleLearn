<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FTC Accumulator</title>
<style>
body{margin:0;background:#101827;color:white;font-family:system-ui;display:flex;justify-content:center}
.app{max-width:900px;padding:20px}
canvas{background:white;border-radius:16px;width:100%;max-width:850px;touch-action:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
button{font-size:17px;border:0;border-radius:10px;padding:10px;background:#ffcb05;color:#00274c;font-weight:800}
.pill{background:#243b55;border-radius:999px;padding:8px 13px}
</style>
</head>
<body>
<div class="app">
<h1>FTC Accumulator</h1>
<p>Top graph is f. Drag the bottom beads to draw F where F(0)=0 and each rise equals accumulated signed area.</p>
<canvas id="cv" width="850" height="520"></canvas>
<div class="row"><span id="lvl" class="pill"></span><button onclick="check()">Check Accumulation</button><button onclick="reset()">Reset</button><span id="msg" class="pill"></span></div>
</div>
<script>
const cv=document.getElementById("cv"),c=cv.getContext("2d");
const L=[
 {f:[1,2,1,-1,-2,1]},
 {f:[-1,-1,2,2,-1,3]},
 {f:[2,0,-2,1,1,-1]},
 {f:[.5,1.5,2.5,-1.5,-.5,1]}
];
let i=0,Y=[],drag=-1;
const x0=90,dx=110,top=140,bot=390,scale=35;
function target(){let a=[0];for(let v of L[i].f)a.push(a[a.length-1]+v);return a}
function reset(){Y=Array(7).fill(0);draw()}
function draw(){
 lvl.textContent=`Level ${i+1}/${L.length}`;
 c.clearRect(0,0,850,520);c.font="18px system-ui";
 c.fillStyle="#111";c.fillText("f(x)",30,35);c.fillText("F(x)=∫f",30,285);
 for(let row of [top,bot]){
  c.strokeStyle="#ddd";for(let k=0;k<=6;k++){c.beginPath();c.moveTo(x0+k*dx,row-120);c.lineTo(x0+k*dx,row+120);c.stroke()}
  for(let y=-3;y<=3;y++){c.beginPath();c.moveTo(50,row-y*scale);c.lineTo(800,row-y*scale);c.stroke()}
  c.strokeStyle="#00274c";c.lineWidth=2;c.beginPath();c.moveTo(50,row);c.lineTo(800,row);c.stroke();c.lineWidth=1;
 }
 let f=L[i].f;c.fillStyle="#2f80ed88";c.strokeStyle="#2f80ed";c.lineWidth=3;
 for(let k=0;k<6;k++){let h=f[k];c.fillRect(x0+k*dx,top-Math.max(h,0)*scale,dx,Math.abs(h)*scale);c.strokeRect(x0+k*dx,top-Math.max(h,0)*scale,dx,Math.abs(h)*scale)}
 c.strokeStyle="#ffcb05";c.lineWidth=4;c.beginPath();
 for(let k=0;k<7;k++){let px=x0+k*dx,py=bot-Y[k]*scale;if(k)c.lineTo(px,py);else c.moveTo(px,py)}
 c.stroke();
 for(let k=0;k<7;k++){c.fillStyle=k==0?"#00274c":"#e84a5f";c.beginPath();c.arc(x0+k*dx,bot-Y[k]*scale,9,0,7);c.fill()}
}
cv.onpointerdown=e=>{let r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*850/r.width,my=(e.clientY-r.top)*520/r.height;for(let k=1;k<7;k++)if(Math.hypot(mx-(x0+k*dx),my-(bot-Y[k]*scale))<20)drag=k}
cv.onpointermove=e=>{if(drag<0)return;let r=cv.getBoundingClientRect(),my=(e.clientY-r.top)*520/r.height;Y[drag]=Math.round((bot-my)/scale*2)/2;draw()}
cv.onpointerup=()=>drag=-1;
function check(){
 let T=target(),err=T.reduce((s,v,k)=>s+Math.abs(v-Y[k]),0);
 if(err<.01){msg.textContent="FTC unlocked!";i=(i+1)%L.length;setTimeout(()=>{msg.textContent="";reset()},700)}
 else msg.textContent="Each step of F must equal area of one f-rectangle.";
}
reset();
</script>
  <script id="_metadata" type="application/json">
    {
      "summary": "",
      "card_background_color": "#e1e1e1"
    }
  </script>
</body>
</html>
